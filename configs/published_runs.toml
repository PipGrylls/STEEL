# Published STEEL run configurations
#
# Which model configuration produced which published figure. This
# mapping did not exist anywhere before: `STEEL.py`'s `Tdyn_Factors`
# list is a pile of commented-out lines that does not correspond to any
# paper, so the configurations here are recovered from the plotting and
# post-processing scripts that consumed the outputs, and cross-checked
# against the thesis text. Every entry names its `source`.
#
# The run tuple is `STEEL.py`'s `Factor_Stripping_SF`:
#
#   (f_tdyn, Stripping, SF, z_evo, SFR_Model, AbnMtch)
#
# and the output directory is those six fields joined with underscores,
# `RunParam_<f0>_<f1>_..._`, which is what both implementations write to
# and what the plotting scripts read from.
#
# ---------------------------------------------------------------------
# A caveat that applies to every Paper 1 entry
# ---------------------------------------------------------------------
# Paper 1 predates the current tuple format and its tuples **cannot be
# replayed by the committed `STEEL.py` without adaptation**:
#
#   * field 0 (`f_tdyn`) is a float there, e.g. `1.0` / `np.inf`, but
#     `STEEL.py:216` does `Factor_Stripping_SF[0][-4:] == "_Alt"`, which
#     raises `TypeError` on a float. It must be a string: `"1.0"`.
#   * field 4 is the literal `True` in the no-star-formation runs, but
#     `STEEL.py:229` does `Factor_Stripping_SF[4][-3:] == "_PP"`, which
#     raises `TypeError` on a bool. It must be a string.
#
# Field 4 is genuinely unused when `SF = False` (it reaches
# `Paramaters['SFR_Model']`, read only inside `StarFormation`, which is
# only called when `SF` is true), so substituting a placeholder changes
# no number. It does change the output directory name — hence both
# `tuple_published` and `tuple_runnable` below, and `dir` always
# reflects `tuple_runnable`.
#
# Two features the published runs need that the Rust port did not
# originally expose, both added while building this table:
#
#   * `Paramaters['PreProcessing']` -- the `_PP` suffix on the SFR model
#     field. Four Paper 2 entries use it. It pre-quenches a
#     mass-dependent prefix of each satellite's realization ensemble at
#     infall. The `_PP` also has to reach the output directory name, or
#     a pre-processed run silently overwrites its non-pre-processed twin.
#   * `[smhm] preset = "override_z"` with explicit `[smhm.params]`, for
#     Paper 3's fourteen single-coefficient SMHM perturbations, plus a
#     `legacy_name` field so each lands in its own directory rather than
#     all fourteen deriving `Override_z`.
#
# `f_tdyn = inf` needs no special handling in either implementation:
# the dynamical friction time becomes infinite, `Tdyf < TTZ0` is never
# true, nothing merges, the stripping time fraction is 0 and the pair
# separation never shrinks. Verified in both — see `notes` on
# `p1-tdyn-inf`.

[meta]
grid = "AnalyticHaloMass 11.0 -> 16.6 in 0.1 dex, Min_Corr = -1, HighRes = False"
sm_cuts = [9.0, 9.5, 10.0, 10.5, 11.0, 11.45]
n_realizations = 5
note = """The published runs used the code as committed, i.e. before the
corrections in docs/PORT_CORRECTIONS.md. Reproducing a published figure
therefore means running the py-as-is leg; the py-corrected and rs-steel
legs answer a different question."""


