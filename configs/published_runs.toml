# =====================================================================
# Paper 3 -- galaxy pairs (arXiv 2001.06017). Thesis Chapter 5.
#
# Paper 3 is a systematics study: it perturbs one coefficient of the
# SMHM relation at a time and reads off the effect on the pair fraction.
# The variants are `AbnMtch['PFT'] = True` plus exactly one of the
# fourteen `*_PFT*` flags, each a single-coefficient offset from a
# common base (Functions/Functions.py:611-638):
#
#   base: M10 = 12.0, N10 = 0.032, beta10 = 1.5, gamma10 = 0.56
#         M11 =  0.6, N11 = -0.014, beta11 = -0.7, gamma11 = 0.08
#         scatter = 0.15
#
# The variant names appear only in the commented-out `*_Factors` lists
# at Scripts/CentralPostprocessing.py:362-366, so which figure used
# which is inferred from thesis Ch. 5 fig:PairFracSystematic, which
# shows exactly four parameter groups (M, N, beta, gamma) each with a
# reference plus three perturbations.
#
# In the Rust these are the `override_z` SMHM preset with explicit
# `[smhm.params]` plus a `legacy_name`; the coefficient sets are
# generated into `rust/runfiles/published/p3-pft-*.toml`.
# =====================================================================

[[run]]
id = "p3-reference"
paper = "P3"
figures = ["P3 fig:PairFracSystematic (blue, all panels)"]
tuple_published = ["1.0", true, true, true, "CE", "G19_SE"]
tuple_runnable = ["1.0", true, true, true, "CE", "G19_SE"]
dir = "RunParam_1.0_True_True_True_CE_G19_SE_"
source = "Thesis Chapters/C5_GalaxyPairs.tex:103"
notes = "The PyMorph reference relation the perturbations are measured against."

[[run]]
id = "p3-pft-family"
paper = "P3"
figures = ["P3 fig:PairFracSystematic"]
generated = "rust/runfiles/published/p3-pft-*.toml"
source = "Functions/Functions.py:611-638; Scripts/CentralPostprocessing.py:362-366"
notes = """Fourteen single-coefficient perturbations. Expanded into
explicit SMHM coefficients by Scripts/Validation/make_runfiles.py, since
neither the Rust registry nor a runfile has (or should have) fourteen
more named presets."""

[[run]]
id = "p3-cmodel"
paper = "P3"
figures = ["P3 fig:PairFractionData"]
tuple_published = ["1.0", true, true, true, "CE", "G19_cMod"]
tuple_runnable = ["1.0", true, true, true, "CE", "G19_cMod"]
dir = "RunParam_1.0_True_True_True_CE_G19_cMod_"
source = "Thesis Chapters/C5_GalaxyPairs.tex:146-147"
notes = "cmodel photometry: shallower high-mass slope than PyMorph, ~0.1 dex higher pair fraction."

[[run]]
id = "p3-illustris"
paper = "P3"
figures = ["P3 fig:PairFractionIll"]
tuple_published = ["1.0", true, true, true, "Illustris", "Illustris"]
tuple_runnable = ["1.0", true, true, true, "Illustris", "Illustris"]
dir = "RunParam_1.0_True_True_True_Illustris_Illustris_"
source = "STEEL.py Tdyn_Factors (commented); Thesis Chapters/C5_GalaxyPairs.tex:136"
notes = "SMHM relation calibrated to Illustris TNG, compared against pair fractions extracted directly from TNG."


# =====================================================================
# Gaps
# =====================================================================
# Recorded rather than guessed at:
#
# * Paper 2's iterative SFR <-> satellite-accretion loop (thesis Ch. 4)
#   is described in the text but has no driver in the repository. It is
#   not a single run tuple and cannot be reconstructed from the scripts.
# * The gamma_z scan of thesis fig:PairFractionHMevo (gamma11 from 0.0
#   to 0.5 in steps of 0.1, on the cmodel relation) is a sixth family
#   with no corresponding `*_Factors` list; expressible via `override_z`
#   but its exact base coefficients are not recorded anywhere.
# * No observational data exists in the repository, so no entry here can
#   currently be checked against the data overlays in its figure.
