# p2-dpl-frozen-tdyn-0.5 -- Paper 2 Fig. 10/11's f_tdyn=0.5 line (frozen model).
# Published as: ['0.5', False, False, True, 'G19_DPL', 'G19_SE']

[merger_time]
dynamical_time_factor = 0.5
redshift_correction = false

[smhm]
model = "moster_form"
preset = "g19_se"
z_evo = true

[sfr]
model = "double_power_law"

[run]
log_m_min = 11.0
log_m_max = 16.6
log_m_bin = 0.1
star_formation = false
pre_processing = false
stellar_stripping = false
