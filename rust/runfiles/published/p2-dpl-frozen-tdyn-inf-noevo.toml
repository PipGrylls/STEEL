# p2-dpl-frozen-tdyn-inf-noevo -- Paper 2 Fig. 8/9's f_tdyn=inf, non-evolving-SMHM line.
# Published as: ['inf', False, False, False, 'G19_DPL', 'G19_SE']

[merger_time]
dynamical_time_factor = inf
redshift_correction = false

[smhm]
model = "moster_form"
preset = "g19_se"
z_evo = false

[sfr]
model = "double_power_law"

[run]
log_m_min = 11.0
log_m_max = 16.6
log_m_bin = 0.1
star_formation = false
pre_processing = false
stellar_stripping = false
