delta   =  0.0658936762  # DELTA,   bestfit_var15_fin.dat[15], sf_model.h:77
gamma_0 = -1.91445849    # GAMMA,   bestfit_var15_fin.dat[16], sf_model.h:78
gamma_a =  4.13279629    # GAMMA_A, bestfit_var15_fin.dat[17], sf_model.h:79
gamma_z = -0.920527434   # GAMMA_A2,bestfit_var15_fin.dat[18], sf_model.h:80

# v_q / sigma_vq (DR1 high-mass/mass-quenching term -- distinct from the
# NEW v_q2/sigma_vq2 low-mass term above): c.q_lvmp = Q_LVMP +
# flow20*Q_LVMP_A + fhigh20*Q_LVMP_Z; c.q_sig_lvmp = Q_SIG_LVMP +
# flow20*Q_SIG_LVMP_A + fmid20*Q_SIG_LVMP_Z  [sf_model.c:124-125].
v_q_0       =  2.23213145    # Q_LVMP,       bestfit_var15_fin.dat[27], sf_model.h:92
v_q_a       =  0.138994602   # Q_LVMP_A,     bestfit_var15_fin.dat[28], sf_model.h:93
v_q_z       =  0.107465062   # Q_LVMP_Z,     bestfit_var15_fin.dat[29], sf_model.h:94
sigma_vq_0  =  0.270386706   # Q_SIG_LVMP,   bestfit_var15_fin.dat[30], sf_model.h:95
sigma_vq_a  = -0.203837747   # Q_SIG_LVMP_A, bestfit_var15_fin.dat[31], sf_model.h:96
sigma_vq_z  =  0.0542323029  # Q_SIG_LVMP_Z, bestfit_var15_fin.dat[32], sf_model.h:97

# fq_min (quenched-fraction floor at low mass, before the new low-mass
# quenching term is added back on top): c.fq_min = Q_MIN +
# flow20*Q_MIN_A, clamped to >=0  [sf_model.c:121-122].
q_min_0 = -1.08574167   # Q_MIN,   bestfit_var15_fin.dat[33], sf_model.h:98
q_min_a =  0.721040181  # Q_MIN_A, bestfit_var15_fin.dat[34], sf_model.h:99

[formula]
# SFR(vMpeak,z), star-forming mode (sfr_sf_grid.npy). Verbatim from four
# byte-identical, un-conflicted copies of the same function at this
# pinned commit: gen_total_csfr.c:36-40, gen_colorplot_uncertainties.c:
# 30-33, gen_total_uvlf.c:47-50, estimate_total_csfr.c:14-17.
#   vd  = lv - v_1                      (lv = log10(vMpeak))
#   SFR(lv) = epsilon * ( 1 / (10^(alpha*vd) + 10^(beta*vd))
#                         + gamma * exp(-0.5*(vd/delta)^2) )
# epsilon, v_1, alpha, beta, gamma, delta all come from calc_sf_model()
# (sf_model.c:73-96) evaluated at the grid's z. sfr_sf_grid.npy stores
# log10(SFR), in Msun/yr (SFR is used directly, unconverted, when
# gen_total_csfr.c sums it against number density to report
# "Total_CSFR(Msun/yr)" -- confirms no extra unit factor is needed).
sfr_formula = "epsilon * (1/(10^(alpha*(lv-v_1)) + 10^(beta*(lv-v_1))) + gamma*exp(-0.5*((lv-v_1)/delta)^2))"

# f_Q(vMpeak,z) (quenched_fraction_grid.npy). Verbatim from
# make_sf_catalog.c:687 -- the ONLY place in the checked-out tree where
# q_lvmp_low/q_sig_lvmp_low (the new SAGA low-mass quenching term) are
# ever consumed:
#   fq = fq_min + (1-fq_min)*Phi((lv-q_lvmp)/q_sig_lvmp)
#              + (1-fq_min)*(1 - Phi((lv-q_lvmp_low)/q_sig_lvmp_low))
# where cached_rank(x) (upstream's name for Phi) is proven equal to the
# exact standard-normal CDF 0.5+0.5*erf(x/sqrt(2)) by its own generator
# (make_sf_catalog.c:1295: "erf_cache[i] = 0.5+0.5*erf(x/M_SQRT2)") and
# consumer (make_sf_catalog.c:1312-1318, linear interpolation of that
# same table). This fixture uses the exact closed form rather than the
# lookup-table approximation -- strictly more precise, not a different
# formula. The result is clamped to [0,1] for this fixture (JUDGMENT
# CALL, flagged): the additive combination of two independent sigmoids
# has no a-priori upper bound below 1, and no explicit clamp is visible
# at the point of use in make_sf_catalog.c:687 itself, but downstream
# consumers (e.g. rank_to_sfr) assume fq in [0,1]; clamping matches the
# only self-consistent reading of the code and is required by the task
# brief's own um_quenched_fraction_is_a_fraction test. In practice, on
# this fixture's grid the pre-clamp value never left [0,1] by more than
# floating-point roundoff.
fq_formula = "fq_min + (1-fq_min)*Phi((lv-q_lvmp)/q_sig_lvmp) + (1-fq_min)*(1-Phi((lv-q_lvmp_low)/q_sig_lvmp_low)), clamped to [0,1]"
z_basis_note = "flow=1-a; fmid=ln(1+z)-flow; fhigh=z-flow; the *_20 variants cap z at 20 before computing flow/fmid/fhigh (sf_model.c:75-85). alpha/beta/gamma/epsilon/q_lvmp*/q_sig_lvmp* use the capped (*_20) basis; v_1/r_cen use the uncapped basis. All z values in this fixture's grid (max 6.0) are well below the z=20 ceiling, so this distinction does not affect the committed values, but matters for any future extension of the grid."

[grid]
log_vmpeak_min = 1.4
log_vmpeak_max = 3.0
log_vmpeak_step = 0.04
n_velocity = 41
redshifts = [0.1, 0.5, 1.0, 2.0, 4.0, 6.0]
dtype = "float64"
order = "C"
axes = "[velocity, redshift]"

[conventions]
velocity_units = "km/s"
# vMpeak's precise definition, resolved directly from upstream's own
# merger-tree-building code (split_halo_trees_phase2.c), NOT a guess:
# EXTRA_HALO_INFO (line 20) tracks a *separate* running-max-of-Vmax
# pointer (vpeak_halo) DISTINCT from the running-max-of-Mvir pointer
# (mpeak_halo, updated at lines 462-463: "if (h->mvir >
# h->prog->mpeak_halo->mvir) h->mpeak_halo = h; else h->mpeak_halo =
# h->prog->mpeak_halo;"). The catalog field actually named "vmp"
# ("vMpeak") is assigned from mpeak_halo, NOT vpeak_halo:
#   ch.vmp = h->mpeak_halo->vmax;   (line 736)
#   ch.mp  = h->mpeak_halo->mvir;   (line 738)
# i.e. vMpeak = Vmax evaluated AT the halo's peak-Mvir epoch, NOT the
# historical maximum of Vmax over the halo's whole history (that
# quantity exists too, as vpeak_halo->vmax, but is a different field
# never used as "vmp" anywhere in the codebase). Task 11's Mpeak->Vmax
# conversion must reproduce THIS definition: Vmax computed at the epoch
# of peak halo mass, not the peak of Vmax's own history.
vmpeak_definition = "vmax_at_mpeak"   # Vmax at the epoch of peak Mvir (NOT peak-over-history of Vmax); split_halo_trees_phase2.c:462-463,736,738
halo_mass_definition = "vir"    # "mvir" throughout split_halo_trees_phase2.c (standard Rockstar/consistent-trees virial mass); no other mass definition appears anywhere near mpeak/vmp tracking
h_convention = "h_free"         # vmax/vmp are stored and consumed in km/s with no 1/h or h factor applied anywhere in split_halo_trees_phase2.c or sf_model.c; the grid's log_vmpeak axis is likewise absolute, not h-scaled
imf = "chabrier"                # README.pdf (this repo, section 7.1, p.20): "All files provided should ideally have the same assumptions employed: specifically, a Chabrier IMF, a Calzetti dust law, and the BC03 SPS model."

[build_notes]
# Real, upstream defects discovered and worked around at this exact
# pinned commit (6aff8d79...), recorded for reproducibility and so a
# future re-run isn't surprised by them:
makefile_conflict = "Makefile lines 18-22 (GSL_FLAGS) contain literal, unresolved git merge-conflict markers (a run of seven angle-open characters followed by HEAD / a divider of seven equals characters / a run of seven angle-close characters followed by commit 401bece...) checked into the saga branch at this commit. Both sides are byte-identical except for SLAC/SDF-cluster-specific extra GSL search paths (/sdf/home/y/ycwang/GSL vs /fs/ddn/sdf/group/kipac/g/cosmo/ki21/ycwang/GSL) that exist on neither this machine nor, presumably, most machines outside SLAC. Resolved in the scratchpad clone only (never committed) to the non-conflicting flags plus this machine's real Homebrew GSL install path."
make_sf_catalog_conflict = "make_sf_catalog.c has real, unresolved git merge-conflict markers inside function bodies at lines 930, 936, 968, 984, 1248 (three-way conflicts in one case, markers from two different merge commits: 401bece... and 8aa6ad3...). These are inside actual control-flow / logic (a tmp variable swap block, an included write_catalog.c, and other catalog-writing code), not path-only differences, so they were NOT hand-resolved -- doing so would require guessing upstream's intended merge resolution inside real physics/IO logic, which is out of scope for this task and was explicitly disallowed by the task's stop conditions (no fabricating/guessing). This is why the make / make all (reg) target and any make util target that pulls in make_sf_catalog.c (e.g. sample_corr_sm, sample_dens_sm, sample_conf_sm) do not build. All parameter and formula extraction for this fixture instead used files that compile cleanly at this commit (sf_model.c/h, gen_total_csfr.c, gen_total_uvlf.c, gen_colorplot_uncertainties.c, estimate_total_csfr.c) plus a direct, line-cited read of make_sf_catalog.c:687 (which sits well before the first conflict marker at line 930, and was verified by direct inspection to contain no conflict markers itself)."
malloc_h = "make_sf_catalog.c and other files #include malloc.h, which does not exist on macOS/Darwin (malloc/free are declared via stdlib.h there). Worked around with a one-line scratchpad-only shim header (containing only #include stdlib.h) added to the include path via CC='cc -I SHIMDIR'; not a upstream defect, just a Linux-vs-macOS portability gap, and not committed."

[files]
sfr_sf_grid = "sfr_sf_grid.npy"
quenched_fraction_grid = "quenched_fraction_grid.npy"

