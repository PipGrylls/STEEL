# no longer tracked; the sub '300' represents the host halo vMpeak scale
# of 300 km/s (roughly Milky-Way mass scale) for the orphan galaxy."
# (README.pdf:329-332). This is ORPHAN_THRESH_V1 (sf_model.h:112),
# consumed as exactly this ratio in sample_dens_sm.c:188 and
# sample_corr_sm.c:250 ("halos[i].v is less than orphan_thresh*halos[i].vmp").
# NOTE: this parameter plays NO role in either committed grid (it never
# appears in calc_sf_model()'s epsilon/alpha/beta/gamma/delta or in the
# q_lvmp*/q_sig_lvmp* fields; it only gates orphan-subhalo disruption in
