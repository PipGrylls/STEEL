# the halo vmax scale at which the low-mass f_Q reaches 50%" and
# "sigma_VQ2,0, sigma_VQ2,a, sigma_VQ2,z: ... the scale parameter of the
# error functional form." calc_sf_model() (sf_model.c:128-129):
# c.q_lvmp_low = Q_LVMP_low + flow20*Q_LVMP_low_A + fhigh20*Q_LVMP_low_Z;
# c.q_sig_lvmp_low = Q_SIG_low_LVMP + flow20*Q_SIG_low_LVMP_A + fmid20*Q_SIG_low_LVMP_Z.
v_q2_0       =  1.65023184    # Q_LVMP_low,        bestfit_var15_fin.dat[46], sf_model.h:115
v_q2_a       = -0.264936233   # Q_LVMP_low_A,      bestfit_var15_fin.dat[47], sf_model.h:116
v_q2_z       = -0.754329105   # Q_LVMP_low_Z,      bestfit_var15_fin.dat[48], sf_model.h:117
sigma_vq2_0  =  0.162369262   # Q_SIG_low_LVMP,    bestfit_var15_fin.dat[49], sf_model.h:118
sigma_vq2_a  =  0.386523504   # Q_SIG_low_LVMP_A,  bestfit_var15_fin.dat[50], sf_model.h:119
sigma_vq2_z  =  0.0807415281  # Q_SIG_low_LVMP_Z,  bestfit_var15_fin.dat[51], sf_model.h:120
# (sf_model.c:63's own inline comment literally labels this last one
# "//sVQ_2,la", i.e. upstream itself uses "la" and "z" as interchangeable
# labels for this slot -- consistent with the ambiguity resolved above
# for the alpha family.)

[fixed_parameters_needed_to_evaluate_the_grids]
# Held FIXED during the UM-SAGA MCMC (not among the 15 explored) but
# REQUIRED to evaluate SFR(vMpeak,z) and f_Q(vMpeak,z) at all -- these
# were flagged by the task controller as "never captured at all" during
# design and are sourced here for the first time, same
# bestfit_var15_fin.dat / sf_model.h citation discipline as above.
#
# log_sfr_norm (EFF_0 family): c.epsilon = 10^(EFF_0 + EFF_0_A*flow20 +
# EFF_0_A2*fhigh20 + EFF_0_A3*fmid20)  [sf_model.c:90] -- the SFR
# normalization, expressed in log10, hence the name.
log_sfr_norm_0  =  0.219183863   # EFF_0,    bestfit_var15_fin.dat[0], sf_model.h:62
log_sfr_norm_a  =  0.601031497   # EFF_0_A,  bestfit_var15_fin.dat[1], sf_model.h:63
log_sfr_norm_z  = -0.767542291   # EFF_0_A2, bestfit_var15_fin.dat[2], sf_model.h:64
log_sfr_norm_la =  5.21295141    # EFF_0_A3, bestfit_var15_fin.dat[3], sf_model.h:65

# v_pivot (V_1 family): c.v_1 = V_1 + flow*V_1_A + fhigh*V_1_A2 +
# V_1_A3*fmid  [sf_model.c:91] -- note this uses the UNcapped
# flow/fhigh/fmid (no z=20 ceiling), unlike alpha/beta/gamma/epsilon.
v_pivot_0  =  2.13901060   # V_1,    bestfit_var15_fin.dat[4], sf_model.h:66
v_pivot_a  = -0.141230884  # V_1_A,  bestfit_var15_fin.dat[5], sf_model.h:67
v_pivot_z  = -0.215809966  # V_1_A2, bestfit_var15_fin.dat[6], sf_model.h:68
v_pivot_la =  1.56135690   # V_1_A3, bestfit_var15_fin.dat[7], sf_model.h:69

# beta (high-mass branch of the double power law): c.beta = BETA +
# flow20*BETA_A + fhigh20*BETA_A2  [sf_model.c:94]. Only 2 evolution
# terms exist for beta (no 3rd/"la" term -- sf_model.c:94 never
# references a fmid20*BETA_A3 term, and no such macro exists in
# sf_model.h), unlike alpha/epsilon/v_1's 3-term evolution.
beta_0 = -1.81310646   # BETA,    bestfit_var15_fin.dat[12], sf_model.h:74
beta_a =  0.767409694  # BETA_A,  bestfit_var15_fin.dat[13], sf_model.h:75
beta_z =  1.77222666   # BETA_A2, bestfit_var15_fin.dat[14], sf_model.h:76

# delta and gamma (needed for the exp(-0.5*(vd/delta)^2) bump term):
