# Provenance for the committed UM-SAGA reference grids.
# Everything needed to regenerate them from scratch.
#
# Both grids are a direct, literal evaluation of upstream UM-SAGA's own
# compiled calc_sf_model() (src/sf_model.c) plus two small formulas
# (sfr_at_vmp() and the combined star-forming/low-mass quenched-fraction
# expression) transcribed verbatim from real, un-conflicted source lines
# at the pinned commit -- not a reimplementation from a paper or a guess.
# See [formula] and [method] below before trusting this fixture for
# anything beyond what it actually is; in particular, note the upstream
# repository's own checked-in Makefile and make_sf_catalog.c contain real,
# unresolved git merge-conflict markers at this exact pinned commit (see
# [build_notes]) -- this is an upstream defect, not something introduced
# here, and it is why the full `make_sf_catalog` binary could not be
# built end-to-end.

[upstream]
repo = "https://bitbucket.org/RW-Stanford/universemachine-saga.git"
ref = "saga"
commit = "6aff8d792e81bf6049058e3e1bc6f2cfa616b525"
build_command = "make util CC='cc -I SHIMDIR' where SHIMDIR/malloc.h contains only #include stdlib.h (macOS has no top-level malloc.h; this changes no semantics, matching Task 8's GSL_INCL-style portability flag). The upstream Makefile at this exact pinned commit has two literal unresolved git merge-conflict blocks (GSL_FLAGS, lines 18-22) that were hand-resolved in the scratchpad clone only (never committed) by keeping the non-conflicting flags and pointing GSL at this machine's Homebrew install (-L/opt/homebrew/lib -I/opt/homebrew/include); both conflict sides were byte-identical except for SLAC/SDF-cluster-specific extra GSL search paths that do not exist on this machine, so no model-affecting choice was made. make all (the make_sf_catalog/reg target) fails to compile: make_sf_catalog.c itself has real, unresolved git merge-conflict markers in its body (lines 930, 936, 968, 984, 1248 at this pinned commit) that are NOT path-only and were NOT hand-resolved (resolving them would require guessing upstream's intent inside real logic, which is out of scope and risky) -- see build_notes below. make util builds successfully up to (and including) gen_total_csfr, gen_total_uvlf, extract_smhm_params, gen_plot_data, extract_slopes and others; it fails only when it reaches sample_corr_sm.c, which includes the same broken make_sf_catalog.c. The already-built gen_total_csfr binary (Mach-O 64-bit arm64, ran successfully, confirms sf_model.c/sf_model.h compile and link cleanly) was used as an executable sanity check of the base (DR1-inherited) SFR formula; see method section below."
run_command = "A scratchpad-only driver (um_fixture_driver.c, not committed) was compiled with: cc -I. -I SHIMDIR -std=c99 -O2 um_fixture_driver.c sf_model.c -lm -o um_fixture_driver -- i.e. linked directly against the pinned commit's real, unmodified, compiling sf_model.c (calc_sf_model()) -- and run as ./um_fixture_driver scripts/bestfit_var15_fin.dat (the real upstream best-fit parameter file, read in NUM_PARAMS+1=53 double format exactly as gen_total_csfr.c's own main() reads it via stringparse). The driver calls calc_sf_model(m, a=1/(1+z)) once per (log_vmpeak,z) grid point, then evaluates sfr_at_vmp() and the combined f_Q formula transcribed verbatim from real source lines (see formula section below); output was piped to CSV and packed into the two .npy files with numpy."
parameter_file = "scripts/bestfit_var15_fin.dat (the real, committed UM-SAGA var15 'final' MCMC best-fit vector; 52 model parameters + chi2, chi2=402.707); cross-referenced against fit_var15_fin.py, which documents the exact same 53-length vector split into fixed blocks PA/PB/PC/PD (37 parameters held fixed during the MCMC) and the 15 explored/free parameters at indices [8:12, 22:26, 44, 46:52] -- see [free_parameter_indices]"

[cosmology]
name = "Planck15"
h = 0.6774
omega_m0 = 0.3089
omega_b0 = 0.0486
omega_de0 = 0.6911
# NOT used anywhere in the SFR(vMpeak,z) or f_Q(vMpeak,z) formulas
# evaluated for this fixture (calc_sf_model/sfr_at_vmp/the fq expression
# are pure functions of log10(vMpeak) and z; no cosmological parameter
# ever enters them). Recorded here only for cross-fixture consistency
# with the EMERGE fixture's [cosmology] block (rust/steel-plugins/tests/fixtures/emerge/provenance.toml),
# per the task brief's template. Note upstream's OWN fit used a
# different, real cosmology for the N-body box the best-fit parameters
# were calibrated against: scripts/um_fit_var15_fin.cfg states
# Om=0.286, Ol=0.714, h0=0.7, fb=0.158 for its "c125-2048" simulation
# box (not Bolshoi-Planck's Om=0.307, h0=0.68, the box the base UM DR1
# README.pdf:1053-1057 recommends). Neither box cosmology is Planck15
# exactly; this discrepancy does not affect the fixture values because,
# as stated, cosmology is not an input to the evaluated formulas.

[free_parameter_indices]
# From fit_var15_fin.py (real, committed): the 53-length parameter
# vector (52 model params + chi2) is split as
# PA(8) + x[0:4] + PB(10) + x[4:8] + PC(18) + [x[8]] + PD(1) + x[9:15],
# where PA/PB/PC/PD are FIXED blocks (37 parameters, held at UM DR1
# posterior-sampled priors) and x is the 15-parameter vector explored by
# COBYLA in the SAGA extension fit. Concatenating block lengths
# (8,4,10,4,18,1,1,6) against sf_model.h's index macros identifies the
# 15 explored/free indices exactly as [8,9,10,11, 22,23,24,25, 44,
# 46,47,48,49,50,51] -- i.e. the ALPHA family, the R_CENTER/R_WIDTH/R_MIN
# family, ORPHAN_THRESH_V1, and the six new Q_LVMP_low/Q_SIG_low_LVMP
# terms. This matches README.pdf section 2.3's prose description of "a
# subset of nine parameters from UM DR1 ... [plus] a set of six new
# parameters" exactly (9 = 4+4+1, 6 = 3+3).
indices = [8, 9, 10, 11, 22, 23, 24, 25, 44, 46, 47, 48, 49, 50, 51]

[um_dr1_inherited_parameters]
# The 9 explored parameters inherited from UM DR1 (README.pdf section
# 2.3). Values read verbatim from scripts/bestfit_var15_fin.dat by
# 0-based index; macro/index citations from sf_model.h.
#
# alpha_0/alpha_a/alpha_la/alpha_z: "the z=0 intercept and three redshift
# evolution coefficients of the low-mass end power-law slope of the
# SFR(vmax) relation" (README.pdf:317-318). calc_sf_model()
# (sf_model.c:92) computes c.alpha = ALPHA + flow20*ALPHA_A +
# fhigh20*ALPHA_A2 + ALPHA_A3*fmid20. Substituting flow20=-(a-1),
# fhigh20=z+(a-1), fmid20=-ln(a)+(a-1) (algebraic identities from
# sf_model.c:79-85's own definitions; verified exactly, not
# approximately) shows the coefficient of the *pure* z basis is exactly
# ALPHA_A2, and the coefficient of the pure ln(a) ("la") basis is
# exactly ALPHA_A3, independent of the (a-1) admixture that all three
# terms share. This resolves the alpha_z-vs-alpha_la ordering ambiguity
# in the task brief's Step 3 template (which lists "alpha_0, alpha_a,
# alpha_la, alpha_z") and is independently corroborated by the
# design-time "unreliable automated summary" values passed into this
# task (alpha_0=-6.14, alpha_a=-3.93, alpha_z=-0.54, alpha_la=6.37),
# which numerically match ALPHA/ALPHA_A/ALPHA_A2/ALPHA_A3 respectively
# to within the vague precision expected of an unverified transcription.
alpha_0  = -6.16624844    # ALPHA,     bestfit_var15_fin.dat[8],  sf_model.h:70
alpha_a  = -3.97921077    # ALPHA_A,   bestfit_var15_fin.dat[9],  sf_model.h:71
alpha_z  = -0.571438200   # ALPHA_A2,  bestfit_var15_fin.dat[10], sf_model.h:72  (exact z-coefficient; see note above)
alpha_la =  6.60432668    # ALPHA_A3,  bestfit_var15_fin.dat[11], sf_model.h:73  (exact ln(a)-coefficient; see note above)

# "Halo-assembly and star formation rate rank correlation r_c ... the
# minimum correlation r_min, the z=0 intercept V_R,0 and redshift
# evolution coefficient V_R,a of the vmax scale that r_c==(1+r_min)/2,
# and the scale parameter of the error function r_width" (README.pdf:
# 322-327). calc_sf_model() (sf_model.c:110): c.r_cen = R_CENTER +
# R_CENTER_A*flow (flow = 1-a, UNcapped, unlike the *_20 variants used
# for alpha/beta/gamma/epsilon); c.r_width = R_WIDTH; c.r_min = R_MIN.
r_min    =  0.464005834   # R_MIN,     bestfit_var15_fin.dat[25], sf_model.h:89
r_width  =  0.240743627   # R_WIDTH,   bestfit_var15_fin.dat[24], sf_model.h:88
v_r_0    =  2.32425410    # R_CENTER,  bestfit_var15_fin.dat[22], sf_model.h:86
v_r_a    = -6.10531145    # R_CENTER_A,bestfit_var15_fin.dat[23], sf_model.h:87

