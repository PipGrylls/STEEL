[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymongo>=4.6", "mcp>=1.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "colossus>=1.3"]

[tool.setuptools.packages.find]
include = ["kernel*", "derivations*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running MongoDB"]
